name: Release

# The tag is the version: pushing v2.0.1 releases 2.0.1. package.json carries
# the major version, bumped by hand; the full version is set only in this run.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check tag major matches package.json
        run: |
          major="$(node -p "require('./package.json').version.split('.')[0]")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%.*}" != "$major" ]; then
            echo "Tag $GITHUB_REF_NAME has a different major version than package.json ($major.x). Bump package.json first."
            exit 1
          fi
      - run: npm ci
      - name: Set version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # Typecheck and tests already ran on the PR that changed main.
      - run: npm run build
      - run: cp build/index.html "diyseed-${GITHUB_REF_NAME}.html"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "diyseed-${GITHUB_REF_NAME}.html" --title "$GITHUB_REF_NAME" --generate-notes
